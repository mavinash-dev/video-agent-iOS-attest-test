name: Fake build (test only)
on:
  push:
    branches: [release/fake-*]
jobs:
  fake:
    if: "!contains(github.event.head_commit.message, 'late')"
    runs-on: ubuntu-latest
    steps:
      - run: echo built > built.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-release-${{ github.sha }}
          path: built.txt
